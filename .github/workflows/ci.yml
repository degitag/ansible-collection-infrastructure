---
name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate / core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core:
        - '2.20'
        - '2.21'
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - name: Install controller dependencies
      run: |
        python -m pip install -r requirements-test.txt
        python -m pip install 'ansible-core~=${{ matrix.core }}.0'
        ansible-galaxy collection install -r requirements.yml
    - name: Run repository checks
      id: checks
      run: |
        bash tests/run_checks.sh
        printf 'artifact=%s\n' "$(python tools/collection_metadata.py artifact)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: matrix.core == '2.21'
      with:
        name: collection
        path: ${{ steps.checks.outputs.artifact }}
        retention-days: 14
        if-no-files-found: error
  smoke:
    name: Smoke / ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image:
        - ubuntu:22.04
        - ubuntu:24.04
        - ubuntu:26.04
        - debian:13
        - rockylinux:9
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      SMOKE_CONTAINER_IMAGE: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - name: Install controller and collection
      run: |
        python -m pip install -r requirements-test.txt
        ansible-galaxy collection install -r requirements.yml
        ansible-galaxy collection install -r requirements-dev.yml
        ansible-galaxy collection build --force
        ansible-galaxy collection install "$(python tools/collection_metadata.py artifact)" --force --no-deps
    - name: Run baseline and verify idempotence
      run: bash tests/run_container_integration_smoke.sh
  functional-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-tests: ${{ steps.matrix.outputs.has-tests }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Plan changed functional roles
      id: matrix
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |-
        python -m pip install 'PyYAML>=6,<7'
        python - <<'PY'
        import json, os, subprocess
        from tests.build_role_functional_matrix import build_matrix
        base = os.environ.get('BASE_SHA', '')
        if not base or set(base) == {'0'}:
            files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
        else:
            files = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
        matrix = build_matrix(changed_files=files)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('matrix=' + json.dumps(matrix) + '\n')
            output.write('has-tests=' + str(bool(matrix['include'])).lower() + '\n')
        PY
  functional:
    name: Functional / ${{ matrix.role_name }} / ${{ matrix.os_name }}
    needs:
    - validate
    - functional-plan
    if: needs.functional-plan.outputs.has-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.functional-plan.outputs.matrix) }}
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - name: Install controller and collection
      run: |
        python -m pip install -r requirements-test.txt
        ansible-galaxy collection install -r requirements.yml
        ansible-galaxy collection install -r requirements-dev.yml
        ansible-galaxy collection build --force
        ansible-galaxy collection install "$(python tools/collection_metadata.py artifact)" --force --no-deps
    - name: Verify role behavior and idempotence
      run: bash tests/run_role_functional_checks.sh "${{ matrix.role_name }}" "${{ matrix.image }}"
'on':
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
