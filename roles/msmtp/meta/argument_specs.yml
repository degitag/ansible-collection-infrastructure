      msmtp_aliases:
        description:
        - Controls `msmtp_aliases` for the `msmtp` role.
        required: false
        type: dict
      msmtp_tls_trust_file:
        description:
        - Controls `msmtp_tls_trust_file` for the `msmtp` role.
        required: false
