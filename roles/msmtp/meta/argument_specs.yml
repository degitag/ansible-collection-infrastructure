---
argument_specs:
  main:
    short_description: Entry point for the msmtp role.
    description:
    - Validate variables for the `msmtp` role.
    options:
      msmtp_auth:
        description:
        - Controls `msmtp_auth` for the `msmtp` role.
        required: false
        type: str
      msmtp_tls:
        description:
        - Controls `msmtp_tls` for the `msmtp` role.
        required: false
        type: str
      msmtp_tls_starttls:
        description:
        - Controls `msmtp_tls_starttls` for the `msmtp` role.
        required: false
        type: str
      msmtp_set_from_header:
        description:
        - Controls `msmtp_set_from_header` for the `msmtp` role.
        required: false
        type: str
      msmtp_syslog:
        description:
        - Controls `msmtp_syslog` for the `msmtp` role.
        required: false
        type: str
      msmtp_default_account:
        description:
        - Controls `msmtp_default_account` for the `msmtp` role.
        required: false
        type: str
      msmtp_logfile:
        description:
        - Controls `msmtp_logfile` for the `msmtp` role.
        required: false
        type: str
      msmtp_aliases_enabled:
        description:
        - Controls `msmtp_aliases_enabled` for the `msmtp` role.
        required: false
        type: bool
      msmtp_accounts:
        description:
        - Required operator-provided relay accounts. No placeholder credentials or relay endpoint is installed by default.
        required: true
        type: list
        no_log: true
