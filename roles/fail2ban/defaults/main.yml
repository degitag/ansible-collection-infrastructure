---
fail2ban_manage_service: true
fail2ban_service_enabled: true
fail2ban_service_state: started
fail2ban_mail_recipient: root@localhost
fail2ban_loglevel: INFO
fail2ban_logtarget: /var/log/fail2ban.log
fail2ban_syslog_target: /var/log/fail2ban.log
fail2ban_syslog_facility: 1
fail2ban_socket: /var/run/fail2ban/fail2ban.sock
fail2ban_pidfile: /var/run/fail2ban/fail2ban.pid
fail2ban_sendername: '{{ ansible_facts.fqdn | default(inventory_hostname) }}'
fail2ban_ignoreips:
- 127.0.0.0/8
- ::1
fail2ban_bantime: 600
fail2ban_maxretry: 3
fail2ban_findtime: 600
fail2ban_backend: systemd
fail2ban_destemail: '{{ fail2ban_mail_recipient }}'
fail2ban_banaction: nftables-multiport
fail2ban_allowipv6: auto
fail2ban_sender:
fail2ban_mta:
fail2ban_protocol:
fail2ban_chain:
fail2ban_jails:
- name: sshd
  enabled: true
  jail_options:
    backend: systemd
#  - name: proxmox
#    enabled: true
#    jail_options:
#      port: https,http,8006
#      filter: proxmox
#      backend: systemd
#      maxretry: 3
#      findtime: 2d
#      bantime: 1h
#    filter_options:
#      failregex: 'pvedaemon\[.*authentication failure; rhost=<HOST> user=.* msg=.*'
#      ignoreregex: ""
#      journalmatch: "_SYSTEMD_UNIT=pvedaemon.service"
fail2ban_manage_epel: true
