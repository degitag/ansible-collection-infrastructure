---
- name: Validate optional yq download pin
  ansible.builtin.assert:
    that:
    - prompt_yq_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    - prompt_yq_checksum is match('^sha256:[a-fA-F0-9]{64}$')
    - ansible_facts.architecture in _prompt_architectures
    fail_msg: Optional yq installation requires a pinned version, SHA256 checksum and supported architecture.
  when: prompt_install_yq | bool
- name: Install interactive shell prerequisites
  ansible.builtin.package:
    name: '{{ _prompt_packages }}'
    state: present
  when: prompt_enabled | bool
  become: true
- name: Install generic Git branch prompt helper
  ansible.builtin.copy:
    src: git-prompt.sh
    dest: '{{ _prompt_profile_dir }}/git-prompt.sh'
    owner: root
    group: root
    mode: '0644'
  when: prompt_enabled | bool
  become: true
- name: Render interactive Bash prompt
  ansible.builtin.template:
    src: prompt.sh.j2
    dest: '{{ _prompt_profile_dir }}/degit-prompt.sh'
    owner: root
    group: root
    mode: '0644'
    validate: /bin/bash -n %s
  when: prompt_enabled | bool
  become: true
- name: Remove owned prompt files when disabled
  ansible.builtin.file:
    path: '{{ _prompt_profile_dir }}/{{ item }}'
    state: absent
  loop:
  - degit-prompt.sh
  - git-prompt.sh
  when: not prompt_enabled | bool
  become: true
- name: Install optional SSH agent helper
  ansible.builtin.copy:
    src: ssh-agent.sh
    dest: '{{ _prompt_profile_dir }}/ssh-agent.sh'
    owner: root
    group: root
    mode: '0644'
  when: prompt_manage_ssh_agent | bool
  become: true
- name: Install optional root shell dotfiles
  ansible.builtin.copy:
    src: '{{ item.source }}'
    dest: /root/.{{ item.target }}
    owner: root
    group: root
    mode: '0600'
  loop:
  - source: ms.sh
    target: ms.sh
  - source: tmux.conf
    target: tmux.conf
  - source: vimrc
    target: vimrc
  - source: gitconfig
    target: gitconfig
  when: prompt_manage_root_dotfiles | bool
  become: true
- name: Install optional bcrypt helper
  ansible.builtin.copy:
    src: bcrypt
    dest: /usr/local/bin/bcrypt
    owner: root
    group: root
    mode: '0755'
  when: prompt_install_bcrypt | bool
  become: true
- name: Install pinned optional yq binary
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/download/v{{ prompt_yq_version }}/yq_linux_{{ _prompt_architectures[ansible_facts.architecture] }}
    dest: '{{ _prompt_yq_path }}'
    checksum: '{{ prompt_yq_checksum }}'
    owner: root
    group: root
    mode: '0755'
  when: prompt_install_yq | bool
  become: true
