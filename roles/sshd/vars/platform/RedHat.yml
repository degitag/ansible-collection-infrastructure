---
sshd_service_name: sshd
sshd_validate_binary: /usr/sbin/sshd
sshd_selinux_packages:
- policycoreutils-python-utils
sshd_selinux_port_type: ssh_port_t
sshd_packages_name:
- openssh-server
- openssh-clients
_sshd_default_kex: sntrup761x25519-sha512@openssh.com,curve25519-sha256,diffie-hellman-group-exchange-sha256
_sshd_runtime_directory: /var/empty/sshd
_sshd_server_include_glob: /etc/ssh/sshd_config.d/*.conf
_sshd_hostkey_marker: /etc/ssh/ssh_host_rsa_key
_sshd_keygen_binary: /usr/bin/ssh-keygen
_sshd_default_ciphers: aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
