---
- name: Restart sssd
  ansible.builtin.systemd:
    name: sssd
    state: restarted
  become: true
  tags: sssd

  when:
  - sssd_manage_service | bool
  - sssd_service_state != 'stopped'
- name: Restart sshd
  ansible.builtin.systemd:
    name: '{{ sssd_sshd_service_name }}'
    state: restarted
  become: true
  tags: sssd
  when:
  - sssd_manage_service | bool
  - sssd_service_state != 'stopped'
