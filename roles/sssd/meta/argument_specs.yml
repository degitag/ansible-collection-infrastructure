---
argument_specs:
  main:
    short_description: Entry point for the sssd role.
    description:
    - Validate variables for the `sssd` role.
    options:
      sssd_domain_name:
        description:
        - Required directory domain. An empty domain fails before changing identity or PAM configuration.
        required: true
        type: str
      sssd_join_domain:
        description:
        - Controls `sssd_join_domain` for the `sssd` role.
        required: false
        type: bool
      sssd_restrict_access:
        description:
        - Controls `sssd_restrict_access` for the `sssd` role.
        required: false
        type: bool
      sssd_manage_mkhomedir:
        description:
        - Controls `sssd_manage_mkhomedir` for the `sssd` role.
        required: false
        type: bool
      sssd_manage_service:
        description:
        - Controls `sssd_manage_service` for the `sssd` role.
        required: false
        type: bool
      sssd_service_enabled:
        description:
        - Controls `sssd_service_enabled` for the `sssd` role.
        required: false
        type: bool
      sssd_service_state:
        description:
        - Controls `sssd_service_state` for the `sssd` role.
        required: false
        type: str
      sssd_ad_group_allowed_ssh_and_sudo:
        description:
        - Controls `sssd_ad_group_allowed_ssh_and_sudo` for the `sssd` role.
        required: false
        type: str
      sssd_ad_group_allowed_ssh_and_sudo_extra:
        description:
        - Controls `sssd_ad_group_allowed_ssh_and_sudo_extra` for the `sssd` role.
        required: false
        type: list
      sssd_ad_group_allowd_ssh_and_sudo:
        description:
        - Controls `sssd_ad_group_allowd_ssh_and_sudo` for the `sssd` role.
        required: false
        type: str
      sssd_ad_group_allowd_ssh_and_sudo_extra:
        description:
        - Controls `sssd_ad_group_allowd_ssh_and_sudo_extra` for the `sssd` role.
        required: false
        type: list
      sssd_ou_to_join_servers:
        description:
        - Controls `sssd_ou_to_join_servers` for the `sssd` role.
        required: false
        type: str
      sssd_bind_user:
        description:
        - Controls `sssd_bind_user` for the `sssd` role.
        required: false
        type: str
      sssd_bind_password:
        description:
        - Controls `sssd_bind_password` for the `sssd` role.
        required: false
        type: str
        no_log: true
      sssd_ad_group_allowed_ssh:
        description:
        - Additional login-only groups; these groups never receive sudo privileges.
        required: false
        type: list
        elements: str
