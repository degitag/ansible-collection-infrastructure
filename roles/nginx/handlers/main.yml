---
- name: Restart nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name | default('nginx') }}"
    state: restarted
  become: true
  tags: nginx

  when:
  - nginx_manage_service | bool
  - nginx_service_state != 'stopped'
- name: Validate nginx configuration
  ansible.builtin.command: "{{ nginx_validate_binary }} -t -c {{ nginx_conf_file_path }}"
  changed_when: false
  become: true
  tags: nginx

- name: Reload nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name | default('nginx') }}"
    state: reloaded
  when:
  - nginx_service_state == "started"
  - nginx_manage_service | bool
  - nginx_service_state != 'stopped'
  become: true
  tags: nginx
