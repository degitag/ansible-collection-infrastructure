---
- name: Update apt cache.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    policy_rc_d: "{{ 101 if ansible_facts.os_family == 'Debian' and not (nginx_manage_service | bool and nginx_service_state == 'started') else omit }}"
  changed_when: false
  become: true
  tags: nginx

- name: Ensure nginx is installed.
  ansible.builtin.apt:
    name: '{{ nginx_package_name }}'
    state: present
    default_release: '{{ nginx_default_release }}'
    policy_rc_d: "{{ 101 if ansible_facts.os_family == 'Debian' and not (nginx_manage_service | bool and nginx_service_state == 'started') else omit }}"
  become: true
  tags: nginx
