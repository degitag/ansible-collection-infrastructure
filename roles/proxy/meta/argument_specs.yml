---
argument_specs:
  main:
    short_description: Entry point for the proxy role.
    description:
    - Validate variables for the `proxy` role.
    options:
      proxy_env:
        description:
        - HTTP(S)/ALL_PROXY URLs and NO_PROXY bypass values. Credentials are normalized without double encoding.
        required: false
        type: dict
      proxy_manage_pip:
        description:
        - Controls `proxy_manage_pip` for the `proxy` role.
        required: false
        type: bool
